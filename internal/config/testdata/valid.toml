# Valid schema-v2 Ulanzi D200X configuration with two ordered profiles.
schema_version = 2
adapter = "ulanzi.d200x"
brightness = 80
default_profile_id = "default"

[[profiles]]
id = "default"
label = "Default"

[[profiles.positions]]
id = "clock"
position = "0_0"
label = "Clock"
background = "#102030"

[profiles.positions.action]
type = "activate_profile"
gesture = "press"
profile_id = "alternate"

[[profiles.positions]]
id = "calendar"
position = "1_0"
label = "Calendar"
background = "#112233"

