# Compact schema-v4 Ulanzi D200X configuration with two keyed profiles.
schema_version = 4
adapter = "ulanzi.d200x"
brightness = 80
default_profile_id = "default"

[profiles."default"]
label = "Default"

[profiles."default".positions."0_0"]
label = "Clock"
background = "#102030"

[profiles."default".positions."0_0".action]
type = "activate_profile"
gesture = "release"
profile_id = "alternate"

[profiles."default".positions."3_2"]
label = "Status"
background = "#1d4e60"

[profiles."alternate"]
label = "Alternate"

[profiles."alternate".positions."0_0"]
label = "Alt Clock"
background = "#202010"

[profiles."alternate".positions."0_0".action]
type = "activate_profile"
gesture = "release"
profile_id = "default"

[profiles."alternate".positions."1_0"]
label = "Alt Calendar"
background = "#232111"
