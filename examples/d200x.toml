# Taplo reads the schema path relative to this TOML file.
#:schema ../schema/hidhogg-d200x-v4.json

# Valid schema-v4 Ulanzi D200X configuration with keyed profiles and coordinates.
schema_version = 4
adapter = "ulanzi.d200x"
brightness = 80
default_profile_id = "default"

[profiles.default]
label = "Default"

[profiles.default.positions]
0_0 = { label = "Clock", background = "#102030", notification_sources = ["clock"], action = { type = "activate_profile", gesture = "release", profile_id = "alternate" } }
1_0 = { label = "Calendar", background = "#112233" }
2_0 = { label = "Timer", background = "#122436" }
3_0 = { label = "Focus", background = "#132639" }
4_0 = { label = "Music", background = "#14283c" }
0_1 = { label = "Weather", background = "#153048" }
1_1 = { label = "Notes", background = "#16324b" }
2_1 = { label = "Mail", background = "#17364e" }
3_1 = { label = "Chat", background = "#183a51" }
4_1 = { label = "Calls", background = "#193e54" }
0_2 = { label = "CPU", background = "#1a4257" }
1_2 = { label = "Memory", background = "#1b465a" }
2_2 = { label = "Network", background = "#1c4a5d" }
3_2 = { label = "Status", background = "#1d4e60" }

[profiles.alternate]
label = "Alternate"

[profiles.alternate.positions]
0_0 = { label = "Alt Clock", background = "#202010" }
1_0 = { label = "Alt Calendar", background = "#232111", action = { type = "activate_profile", gesture = "release", profile_id = "default" } }
2_0 = { label = "Alt Timer", background = "#262212" }
3_0 = { label = "Alt Focus", background = "#292613" }
4_0 = { label = "Alt Music", background = "#2c2814" }
0_1 = { label = "Alt Weather", background = "#302a15" }
1_1 = { label = "Alt Notes", background = "#322e16" }
2_1 = { label = "Alt Mail", background = "#363117" }
3_1 = { label = "Alt Chat", background = "#3a3418" }
4_1 = { label = "Alt Calls", background = "#3e3819" }
0_2 = { label = "Alt CPU", background = "#423c1a" }
1_2 = { label = "Alt Memory", background = "#46401b" }
2_2 = { label = "Alt Network", background = "#4a441c" }
3_2 = { label = "Alt Status", background = "#4e481d" }
